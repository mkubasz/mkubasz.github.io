# Site settings
title: Mateusz Kubaszek
tagline: Senior Technical Leader & Software/AI Architect
description: >-
  Senior Technical Leader with 13+ years experience in AI architecture,
  LLM implementation, cloud systems, and team leadership. Specializing in
  solving complex problems at the intersection of technology and business.

# Author information
author:
  name: Mateusz (Matthew) Kubaszek
  email: m.kubaszek@protonmail.com
  linkedin: https://www.linkedin.com/in/%F0%9F%A7%99-mateusz-kubaszek-58306466/
  github: https://github.com/mkubasz/
  twitter: https://twitter.com/MateuszKubaszek/
  location: Opole, Poland

# Build settings
theme: jekyll-theme-minimal
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Navigation
navigation:
  - title: Home
    url: /
  - title: Services
    url: /services
  - title: Portfolio
    url: /portfolio
  - title: Blog
    url: /blog
  - title: About
    url: /about

# Collections
collections:
  posts:
    output: true
    permalink: /blog/:year/:month/:day/:title/
  projects:
    output: true
    permalink: /portfolio/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .git
  - README.md
